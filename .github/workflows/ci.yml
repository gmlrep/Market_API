name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  ENV: test
  POSTGRES_DB_USER: test
  POSTGRES_DB_PASSWORD: test
  POSTGRES_DB_HOST: localhost
  POSTGRES_DB_PORT: 5432
  POSTGRES_DB: test_market_api
  POSTGRES_TEST_DB: test_market_api
  SALT_STATIC: ci-static-salt-for-tests
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "1"
  FAST_API_PORT: "9000"
  HOST_REDIS: localhost
  PORT_REDIS: "6379"
  IS_ALLOWED_CREDENTIALS: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff check
        run: uvx ruff check app tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_market_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_market_api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate JWT keys
        run: |
          mkdir -p certs
          openssl genrsa -out certs/jwt-private.pem 2048
          openssl rsa -in certs/jwt-private.pem -pubout -out certs/jwt-public.pem

      - name: Run pytest with coverage
        run: |
          uv run coverage run -m pytest tests -v --tb=short
          uv run coverage report -m
          uv run coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
