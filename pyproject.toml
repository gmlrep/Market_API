[project]
name = "market-api"
version = "0.1.0"
description = "Market API — FastAPI marketplace backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13",
    "alembic>=1.14",
    "asyncpg>=0.31",
    "bcrypt>=4.1.3",
    "celery>=5.4.0",
    "cryptography>=43",
    "dependency-injector>=4.49.1",
    "email-validator>=2.3",
    "fastapi>=0.131.0",
    "fastapi-cache2>=0.2.1",
    "flower>=2.0.1",
    "itsdangerous>=2.2.0",
    "passlib~=1.7.4",
    "pillow>=12.1.1",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.11",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "redis>=5.0.4",
    "sqladmin>=0.17.0",
    "sqlalchemy>=2.0.47",
    "starlette>=0.51.0",
    "uvicorn>=0.41",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "httpx>=0.28.1",
    "mypy>=1.15",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3",
    "ruff>=0.11",
    "sqlalchemy-utils>=0.41.2,<1.0.0",
]


[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"app/models/*" = ["F821"]


[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
check_untyped_defs = true


[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = "ignore::DeprecationWarning"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/migrations/*",
    "app/migrations/**/*",
    "app/admin/*",
    "app/processes/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
